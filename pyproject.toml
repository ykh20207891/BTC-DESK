[project]
name = "btc-desk"
version = "0.2.0"
description = "Six-desk automated BTCUSDT trading desk for Bybit"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = [".impeccable", "data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "B904", "RUF012", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
